<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e78">
<title>D2D Rapor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--bg:#f5f5f5;--navy:#1f4e78;--navy2:#2b6a9e;--ok:#2e8b57;--warn:#e08a00;--bad:#c62828;--mut:#6b7785;--line:#dfe3e8;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1c2733;font-size:15px}
header{position:fixed;top:0;left:0;right:0;height:52px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;padding-top:env(safe-area-inset-top);z-index:20}
header h1{font-size:17px;margin:0;font-weight:600}
header .sub{font-size:11px;opacity:.8;display:block;font-weight:400}
.ver{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:14px;padding:5px 11px;font-size:12px}
main{padding:62px 12px 84px;max-width:720px;margin:0 auto}
nav#tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav#tabs button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:11px;color:var(--mut)}
nav#tabs button .ic{display:block;font-size:20px;line-height:22px}
nav#tabs button.on{color:var(--navy);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--navy)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.tile b{display:block;font-size:22px;color:var(--navy)}
.tile span{font-size:11px;color:var(--mut)}
.btn{border:0;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:600;background:var(--navy);color:#fff;width:100%}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.gray{background:#8a95a1}
.btn.sm{padding:7px 10px;font-size:13px;width:auto;border-radius:8px}
.row{display:flex;gap:8px}.row>*{flex:1}
.vi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.vi.ipt{opacity:.55}.vi.ipt .t{text-decoration:line-through}
.vi .h{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut)}
.vi .t{font-weight:600;margin:2px 0}
.vi .s{font-size:13px;color:#33414f;white-space:pre-line;max-height:3.9em;overflow:hidden}
.rz{display:inline-block;font-size:11px;border-radius:10px;padding:2px 8px;margin:4px 4px 0 0;color:#fff;background:#8a95a1}
.rz.b-250{background:var(--ok)}.rz.b-500{background:#7aa62d}.rz.b-1000{background:var(--warn)}.rz.b-asan{background:var(--bad)}.rz.b-yok{background:#8a95a1}
.rz.gec{background:var(--bad)}.rz.duz{background:#5b6fb5}.rz.ipt{background:#555}
.day{font-size:12px;font-weight:600;color:var(--mut);margin:14px 2px 6px}
.fld{display:block;margin-bottom:9px}.fld>span{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;border:1px solid #c9d0d8;border-radius:9px;padding:10px;font-size:15px;background:#fff;font-family:inherit}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:1px solid #b9c3cd;background:#fff;color:#33414f;border-radius:18px;padding:7px 12px;font-size:13px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.uchip{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;border-radius:18px;padding:3px 6px 3px 12px;font-size:13px}
.uchip button{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:50%;width:26px;height:26px;font-size:16px;line-height:1}
.uchip b{min-width:14px;text-align:center}
.lab{font-size:12px;color:var(--mut);margin:6px 0 3px}
.musteri{border:1px solid var(--line);border-left:4px solid var(--navy2);border-radius:10px;padding:10px;margin-bottom:10px;background:#fbfcfd}
.musteri .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:600;color:var(--navy)}
.x{border:0;background:none;color:var(--bad);font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(15,25,35,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.sheet.full{height:100%;max-height:100%;border-radius:0;padding:0}
.sheet.full .fh{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px;padding-top:calc(12px + env(safe-area-inset-top))}
.sheet.full .fh b{font-size:16px}
.sheet.full .fb{padding:12px 12px 96px}
.sheet.full .fbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;max-width:720px;margin:0 auto}
.fh .x{color:#fff;font-size:22px}
pre.kart{background:#fff;border:1px dashed #9fb0c0;border-radius:10px;padding:10px;font-family:inherit;font-size:13px;white-space:pre-wrap;word-break:break-word;margin:6px 0 10px}
.info{font-size:12px;color:var(--mut);margin:4px 0 8px}
.warnbox{background:#fff4e0;border:1px solid #f0c27a;color:#7a4b00;border-radius:10px;padding:9px 11px;margin-bottom:10px;font-size:13px}
.okbox{background:#e8f5ee;border:1px solid #9bd2b2;color:#14532d;border-radius:10px;padding:9px 11px;margin-bottom:10px;font-size:13px}
.yakin{background:#e8f1fa;border:1px solid #a7c4e0;border-radius:10px;padding:9px 11px;margin-bottom:10px;font-size:13px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.pinrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px;font-size:13px}
.sw{display:flex;gap:6px;margin:4px 0 8px}.sw .chip{flex:1;text-align:center;padding:7px 4px}
.mapwrap{position:relative;height:100%}
.pm{position:absolute;inset:0}
.crosspin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);font-size:36px;pointer-events:none;z-index:600;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.mapbar{position:absolute;left:0;right:0;bottom:0;z-index:700;background:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;border-top:1px solid var(--line)}
.maptop{position:absolute;left:0;right:0;top:0;z-index:700;background:var(--navy);color:#fff;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));font-size:14px}
#bmap{height:60vh;border-radius:12px;border:1px solid var(--line);margin-bottom:10px}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;background:var(--navy);transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.g{background:var(--ok)}
.seg2{display:flex;gap:8px;margin-bottom:10px}.seg2 .chip{flex:1;text-align:center}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1c2733;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.on{opacity:.95}
.chg h4{margin:10px 0 4px;color:var(--navy)}.chg ul{margin:0 0 6px 18px;padding:0}.chg li{margin:2px 0;font-size:13px}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:14px}
a.tel{color:var(--navy);font-weight:600;text-decoration:none}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #eef0f3;font-size:14px}.kv span:first-child{color:var(--mut)}
</style>
</head>
<body>
<header><h1>D2D Rapor<span class="sub" id="kullaniciSub"></span></h1><button class="ver" id="verBtn"></button></header>
<main id="app"></main>
<nav id="tabs">
<button data-tab="bugun"><span class="ic">🏠</span>Bugün</button>
<button data-tab="ziyaretler"><span class="ic">📋</span>Ziyaretler</button>
<button data-tab="binalar"><span class="ic">🏢</span>Binalar</button>
<button data-tab="ayar"><span class="ic">⚙️</span>Ayarlar</button>
</nav>
<div id="modalRoot"></div>
<div id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
'use strict';
/* ================= SABİTLER ================= */
const APP_VERSION='1.0.1', APP_DATE='12.11.2026', BUILD_SUFFIX='';
const CHANGELOG=[{v:'1.0.1',t:'12.11.2026',n:[
 'KVKK karıştırma, Portföy Yönetimi ve Panel ile birebir uyumlu hale getirildi (aynı anahtar, ~K~ öneki, aynı yöntem); PY/Panel\'in çözücüsüyle doğrulandı',
 'Harita altlığı CARTO Voyager oldu (CBS aracındaki kurumsal anahtar); uydu görünümü Esri; CARTO açılmazsa OpenStreetMap\'e otomatik geçiş',
 'Ayarlar\'a "Test verilerini temizle" eklendi (ziyaret ve bina kayıtlarını siler, kullanıcı bilgisi ve ilçe/mahalle listesi kalır)',
 'Kullanıcı kodundaki nokta korunuyor (örn. murat.yildizdogan); dosya adlarında da aynen kullanılıyor'
]},{v:'1.0.0',t:'12.11.2026',n:[
 'İlk sürüm: günlük müşteri ziyaret kaydı (bina + giriş + müşteri satırları)',
 'Kayıt anında otomatik saat ve konum damgası; bina pini ile mesafe bandı (≤250 m / ≤500 m / ≤1 km / >1 km / konum yok)',
 'Sonradan girilen kayıtlar için "geç kayıt" işareti',
 'BM WhatsApp "Müşteri Ziyaret Kartı" otomatik üretimi; hazır Sonuç/Aksiyon metinleri ve ek bilgi satırı',
 'Bina ve yönetici rehberi (yönetici adı/telefonu, iletişim izni, altyapı, daire sayısı)',
 'Kaydı düzenleme (sürüm geçmişiyle) ve iptal; kesin silme yok',
 'Günü Kapat: son 7 günün kayıtlarını JSON paketi olarak mail ile paylaşma (mükerrer kayıtlar ID ile ayıklanır)',
 'Hassas alanlar JSON ve cihaz depolamasında karıştırılır; ziyaret kayıtları 60 gün sonra cihazdan silinir',
 'Yedek Al / Yedekten Yükle; ilçe-mahalle listesi CSV ile yüklenir'
]}];
const URUNLER=[{k:'DSL',kat:'DSL'},{k:'TV',kat:'TV'},{k:'Mobil',kat:'Mobil'},{k:'TurboBox',kat:'Mobil'},{k:'Magnet',kat:'Mobil'},{k:'PSTN',kat:'PSTN'},{k:'Cihaz',kat:'Cihaz'},{k:'Kurumsal Ürün',kat:'Kurumsal Ürün'}];
const SONUCLAR=[{k:'satis',l:'Satış'},{k:'on_talep',l:'Ön talep'},{k:'teklif',l:'Teklif verildi'},{k:'bilgilendirme',l:'Bilgilendirme'},{k:'ret',l:'Ret'},{k:'ulasilamadi',l:'Ulaşılamadı'},{k:'yonetici',l:'Yönetici görüşüldü'}];
const OPERATORLER=[{k:'tt',l:'Türk Telekom'},{k:'turkcell',l:'Turkcell Superonline'},{k:'vodafone',l:'Vodafone'},{k:'diger',l:'Diğer'},{k:'bilmiyor',l:'Bilmiyor'}];
const IZIN=[{k:'sorulmadi',l:'Sorulmadı'},{k:'evet',l:'Evet, iletişim izni var'},{k:'hayir',l:'Hayır'}];
const ALTYAPI=[{k:'bilinmiyor',l:'Bilinmiyor'},{k:'hazir',l:'Hazır'},{k:'hazirlanacak',l:'Hazırlanacak'},{k:'yok',l:'Yok'}];
const BANT={'250':'≤250 m','500':'≤500 m','1000':'≤1 km','asan':'>1 km','yok':'Konum yok'};
const SAKLAMA_GUN=60, PAKET_GUN=7, YAKIN_BINA_M=60;
const KARISTIR_ANAHTAR='yuregirtm'; // PY/Panel KVKK_ANAHTAR ile aynı
const IDB_NAME='d2dRapor_db_v1', IDB_STORE='kv', LS_KEY='d2dRapor:state';
const KAT_OF=Object.fromEntries(URUNLER.map(u=>[u.k,u.kat]));
const label=(arr,k)=>(arr.find(x=>x.k===k)||{}).l||k||'';

/*TEST-START*/
/* ================= SAF FONKSİYONLAR ================= */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmtDate=d=>{d=new Date(d);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();};
const fmtTime=d=>{d=new Date(d);return pad(d.getHours())+':'+pad(d.getMinutes());};
const dayKey=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const uid=()=>(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const trLower=s=>(s||'').toLocaleLowerCase('tr').replace(/\u0307/g,'');
const slug=s=>(s||'').toLocaleLowerCase('tr').replace(/\u0307/g,'').replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z0-9.]+/g,'-').replace(/^[-.]+|[-.]+$/g,'');
function toLocalInput(d){d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function pget(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o);}
function pset(o,p,v){const ks=p.split('.');const l=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[l]=v;}
function sureTxt(min){min=Math.max(0,Math.round(min));if(min<60)return min+' dk';if(min<1440)return Math.floor(min/60)+' sa '+(min%60)+' dk';return Math.floor(min/1440)+' gün '+Math.floor((min%1440)/60)+' sa';}

function haversine(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180;const dLa=r(c-a),dLo=r(d-b);const h=Math.sin(dLa/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dLo/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(h)));}
function bantOf(m){if(m==null)return'yok';if(m<=250)return'250';if(m<=500)return'500';if(m<=1000)return'1000';return'asan';}

/* Karıştırma: PY/Panel kvkkEncode ile aynı — UTF-8 -> XOR(yuregirtm) -> Base64, "~K~" öneki */
function enc(s){if(s==null||s==='')return s;if(typeof s!=='string')s=String(s);if(s.startsWith('~K~'))return s;const b=new TextEncoder().encode(s),k=new TextEncoder().encode(KARISTIR_ANAHTAR);let bin='';for(let i=0;i<b.length;i++)bin+=String.fromCharCode(b[i]^k[i%k.length]);return '~K~'+btoa(bin);}
function dec(s){if(typeof s!=='string'||!s.startsWith('~K~'))return s;try{const bin=atob(s.slice(3)),k=new TextEncoder().encode(KARISTIR_ANAHTAR),o=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)o[i]=bin.charCodeAt(i)^k[i%k.length];return new TextDecoder().decode(o);}catch(e){return s;}}
function ziyaretMap(z,fn){const c=clone(z);c.ekNot=fn(c.ekNot);c.sonucMetni=fn(c.sonucMetni);(c.musteriler||[]).forEach(m=>{m.ad=fn(m.ad);m.tel=fn(m.tel);m.not=fn(m.not);});return c;}
function binaMap(b,fn){const c=clone(b);if(c.yonetici){c.yonetici.ad=fn(c.yonetici.ad);c.yonetici.tel=fn(c.yonetici.tel);}return c;}

/* Ürün / sonuç metinleri */
function urunTxt(m){return (m.urunler||[]).map(u=>u.adet+' '+u.urun).join(' + ');}
function takipTxt(iso,ref){if(!iso)return'';const t=new Date(iso+'T12:00:00'),r=new Date(ref);const y=new Date(r.getFullYear(),r.getMonth(),r.getDate()+1);if(dayKey(t)===dayKey(y))return 'yarın dönüş yapılacak';const [yy,mm,dd]=iso.split('-');return dd+'.'+mm+'.'+yy+' tarihinde dönüş yapılacak';}
function musteriSonuc(m,ref){
  const u=urunTxt(m);let t='';
  switch(m.sonuc){
    case 'satis':t=u?u+' satışı yapıldı':'Satış yapıldı';break;
    case 'on_talep':t=u?u+' için ön talep alındı':'Ön talep alındı';break;
    case 'teklif':t=(u?u+' teklifi verildi':'Teklif verildi')+(m.taahhut==='var'?', taahhüt bulunmakta':'');break;
    case 'bilgilendirme':t=u?u+' hakkında bilgilendirme yapıldı':'Ürün ve kampanya bilgilendirmesi yapıldı';break;
    case 'ret':t=(u?u+' teklifi ':'Görüşme ')+'olumsuz sonuçlandı';break;
    case 'ulasilamadi':t='Müşteriye ulaşılamadı';break;
    case 'yonetici':t='Bina yönetimi ile görüşüldü, bilgilendirme yapıldı';break;
    default:t='';
  }
  const tk=takipTxt(m.takip,ref);if(t&&tk)t+=', '+tk;
  return t;
}
function otoSonuc(z){
  const ref=z.baslangic.zaman;const ms=(z.musteriler||[]).filter(m=>m.sonuc);
  if(!ms.length)return'';
  const txt=ms.map(m=>musteriSonuc(m,ref));
  if(txt.every(x=>x===txt[0]))return txt[0];
  return ms.map((m,i)=>(m.ad||('Müşteri '+(i+1)))+': '+txt[i]).join('\n');
}
function sonucMetniUret(z){const o=otoSonuc(z);return z.ekNot&&z.ekNot.trim()?(o?o+'\n':'')+z.ekNot.trim():o;}
function saatAraligi(z){
  const s=new Date(z.baslangic.zaman);if(z.saatElle||!z.olusturma)return fmtTime(s);
  const e=new Date(z.olusturma);if(e-s>=60000&&dayKey(e)===dayKey(s))return fmtTime(s)+'–'+fmtTime(e);return fmtTime(s);
}
function kartMetni(z,b){
  const isimler=(z.musteriler||[]).map(m=>(m.ad||'').trim()).filter(Boolean);
  const ilm=[b.ilce,b.mahalle].filter(Boolean).join(' / ');
  const binaAd=(b.ad||'')+(z.giris&&z.giris.trim()?' ('+z.giris.trim()+')':'');
  let musteri;
  if(isimler.length<=1)musteri='👤 *Müşteri Adı*: '+(isimler[0]||'—');
  else musteri='👤 *Müşteri Adı*:\n'+isimler.map(x=>'- '+x).join('\n');
  const sonuc=(z.sonucMetni&&z.sonucMetni.trim())?z.sonucMetni.trim():sonucMetniUret(z);
  return ['━━━━━━━━━━━━━━','📍 *TÜRK TELEKOM*','📋 *MÜŞTERİ ZİYARET KARTI'+(z.surum>1&&!z.iptal?' (DÜZELTME)':'')+'*','📅 *Tarih*: '+fmtDate(z.baslangic.zaman),'🕒 *Saat Aralığı*: '+saatAraligi(z),'📌 *İlçe / Mahalle*: '+(ilm||'—'),'🏢 *Bina Adı*: '+(binaAd||'—'),musteri,'📊 *Ziyaret Sonuç / Aksiyon*: '+(sonuc||'—')].join('\n');
}
function ozet(z){return (z.musteriler||[]).map(m=>({sonuc:m.sonuc,urunler:(m.urunler||[]).map(u=>({urun:u.urun,adet:u.adet}))}));}
function satisAdetleri(list){const o={};list.forEach(z=>(z.musteriler||[]).forEach(m=>{if(m.sonuc==='satis')(m.urunler||[]).forEach(u=>{const k=u.kat||KAT_OF[u.urun]||u.urun;o[k]=(o[k]||0)+u.adet;});}));return o;}
function adetToplam(list,sonuc){let n=0;list.forEach(z=>(z.musteriler||[]).forEach(m=>{if(m.sonuc===sonuc)(m.urunler||[]).forEach(u=>{n+=u.adet;});}));return n;}
function ilceMahalleParse(text){
  const map=new Map();
  text.split(/\r?\n/).forEach((ln,i)=>{ln=ln.trim();if(!ln)return;const p=ln.split(/[;\t,]/).map(x=>x.trim().replace(/^"|"$/g,''));if(p.length<2||!p[0]||!p[1])return;
    if(i===0&&/^il[cç]e/.test(trLower(p[0]))&&trLower(p[1]).startsWith('mahalle'))return;
    if(!map.has(p[0]))map.set(p[0],new Set());map.get(p[0]).add(p[1]);});
  return [...map.entries()].map(([ilce,s])=>({ilce,mahalleler:[...s].sort((a,b)=>a.localeCompare(b,'tr'))})).sort((a,b)=>a.ilce.localeCompare(b.ilce,'tr'));
}
function mergeById(arr,incoming,verOf){const m=new Map(arr.map(x=>[x.id,x]));let n=0;incoming.forEach(x=>{const o=m.get(x.id);if(!o||verOf(x)>verOf(o)){m.set(x.id,x);n++;}});return {list:[...m.values()],n};}

function serialize(s){const c={ayar:clone(s.ayar),ilceMahalle:s.ilceMahalle,binalar:s.binalar.map(b=>binaMap(b,enc)),ziyaretler:s.ziyaretler.map(z=>ziyaretMap(z,enc)),taslak:null,v:1};

function deserialize(r){const s={ayar:Object.assign({adSoyad:'',kod:'',alicilar:'',sonGonderim:null,sonIlce:'',sonMahalle:''},r.ayar||{}),ilceMahalle:r.ilceMahalle||[],binalar:(r.binalar||[]).map(b=>binaMap(b,dec)),ziyaretler:(r.ziyaretler||[]).map(z=>ziyaretMap(z,dec)),taslak:null};

let _db=null;
function idbOpen(){return new Promise((res,rej)=>{if(_db)return res(_db);if(typeof indexedDB==='undefined')return rej(new Error('idb yok'));const q=indexedDB.open(IDB_NAME,1);q.onupgradeneeded=()=>q.result.createObjectStore(IDB_STORE);q.onsuccess=()=>{_db=q.result;res(_db);};q.onerror=()=>rej(q.error);});}
async function idbGet(k){const db=await idbOpen();return new Promise((res,rej)=>{const r=db.transaction(IDB_STORE).objectStore(IDB_STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbSet(k,v){const db=await idbOpen();return new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readwrite');t.objectStore(IDB_STORE).put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function load(){
  let raw=null;try{raw=await idbGet('state');}catch(e){}

}

function temizlik(){

const sheets=[];let skipPop=0;
function openSheet(html,opt={}){
  const ov=document.createElement('div');ov.className='overlay';ov.innerHTML='<div class="sheet '+(opt.cls||'')+'">'+html+'</div>';
  $('#modalRoot').appendChild(ov);
  const sh={el:ov,sheet:ov.firstChild,onClose:opt.onClose,closed:false};sheets.push(sh);
  try{history.pushState({s:sheets.length},'');}catch(e){}
  if(opt.dismiss!==false)ov.addEventListener('click',e=>{if(e.target===ov)closeSheet(sh);});

function closeSheet(sh,fromPop){
  if(sh.closed)return;sh.closed=true;const i=sheets.indexOf(sh);if(i>=0)sheets.splice(i,1);sh.el.remove();if(sh.onClose)sh.onClose();
  if(!fromPop){skipPop++;try{history.back();}catch(e){skipPop--;}}
}
window.addEventListener('popstate',()=>{if(skipPop>0){skipPop--;return;}const top=sheets[sheets.length-1];if(top)closeSheet(top,true);});

  el.addEventListener('change',e=>{const t=e.target;if(t.dataset&&setVal(t)&&ctx.onChange)ctx.onChange(t.dataset.p,t);});
  el.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||!el.contains(a))return;if(ctx.act)ctx.act(a.dataset.act,a.dataset,a,e);});

function fDate2(iso){return fmtDate(iso)+' '+fmtTime(iso);}
function sonucYenile(){
  if(!D)return;

let formSh=null;
function formSheet(){
  const ctx={root:D,
   refreshPin:()=>{const r=$('#pinrow',formSh.sheet);if(r){r.firstElementChild.outerHTML=pinTxt(D.b);}yakinBinaGoster();taslakKaydet();sonucYenile();},
   hint:()=>D.z.baslangic.lat!=null?{lat:D.z.baslangic.lat,lon:D.z.baslangic.lon}:null,
   onInput:(p,t)=>{
     if(p==='z.sonucMetni'){D.z.sonucElle=true;}
     if(p==='z.ekNot'||p.startsWith('z.musteriler.')||p==='z.giris'||p.startsWith('b.'))sonucYenile();
     if(p==='z.sonucMetni'){const k=$('#kartOnizleme');if(k)k.textContent=kartMetni(D.z,D.b);}
     taslakKaydet();
   },
   onChange:(p,t)=>{
     binaOnChange(ctx,p,formSh);
     if(p==='z.saatElle'){if(D.z.saatElle){D.tmp.origStart=D.z.baslangic.zaman;D.tmp.baslangicLocal=toLocalInput(D.z.baslangic.zaman);}else if(D.tmp.origStart){D.z.baslangic.zaman=D.tmp.origStart;}rerenderForm();}
     if(p==='tmp.baslangicLocal'&&t.value){D.z.baslangic.zaman=new Date(t.value).toISOString();sonucYenile();}
     if(/mevcutOperator$/.test(p)){rerenderForm();}
     if(p.startsWith('z.musteriler.'))sonucYenile();
     taslakKaydet();
   },
   act:async(a,ds,btn)=>{
     const m=ds.i!=null?D.z.musteriler[+ds.i]:null;
     if(a==='kapat'){closeSheet(formSh);return;}
     if(a==='buradayim'||a==='haritadan'){await binaAct(ctx,a,ds,formSh);return;}
     if(a==='binaSec'){const b=S.binalar.find(x=>x.id===ds.id);if(b){D.b=clone(b);D.z.binaId=b.id;rerenderForm();taslakKaydet();}return;}
     if(a==='binaListe'){binaSecSheet(b=>{D.b=clone(b);D.z.binaId=b.id;rerenderForm();taslakKaydet();});return;}
     if(a==='sonuc'){m.sonuc=m.sonuc===ds.v?'':ds.v;rerenderForm();taslakKaydet();return;}
     if(a==='urunToggle'){const k=ds.u;const ix=m.urunler.findIndex(x=>x.urun===k);if(ix>=0)m.urunler.splice(ix,1);else m.urunler.push({urun:k,kat:KAT_OF[k],adet:1});rerenderForm();taslakKaydet();return;}
     if(a==='adet'){const x=m.urunler.find(y=>y.urun===ds.u);if(x){x.adet+=+ds.d;if(x.adet<1)m.urunler.splice(m.urunler.indexOf(x),1);}rerenderForm();taslakKaydet();return;}
     if(a==='taahhut'){m.taahhut=m.taahhut===ds.v?'':ds.v;rerenderForm();taslakKaydet();return;}
     if(a==='musteriEkle'){D.z.musteriler.push(yeniMusteri());rerenderForm();taslakKaydet();return;}
     if(a==='musteriSil'){D.z.musteriler.splice(+ds.i,1);rerenderForm();taslakKaydet();return;}
     if(a==='otomatik'){D.z.sonucElle=false;rerenderForm();taslakKaydet();return;}
     if(a==='kaydet'){await kaydet();return;}
   }};
  formSh=openSheet('',{cls:'full',dismiss:false,onClose:()=>{formSh=null;if(D&&!D.edit)taslakKaydet();}});

}
function rerenderForm(first){

  const k=$('#kartOnizleme',formSh.sheet);if(k)k.textContent=kartMetni(D.z,D.b);

function sonucMetniHazirla(){if(!D.z.sonucElle)D.z.sonucMetni=sonucMetniUret(D.z);}
function dogrula(){
  const e=[];const {z,b}=D;
  if(!(b.ad||'').trim())e.push('Bina adı gerekli');
  if(!(b.ilce||'').trim())e.push('İlçe gerekli');
  if(!D.edit&&!b.pin)e.push('Bina pini işaretlenmeli (Buradayım veya Haritadan seç)');
  const ms=z.musteriler.filter(m=>m.ad.trim()||m.sonuc||m.urunler.length||m.tel.trim());
  if(!ms.length)e.push('En az bir müşteri satırı doldurun (sonuç seçin)');
  ms.forEach((m,i)=>{const n='Müşteri '+(i+1)+': ';if(!m.sonuc)e.push(n+'sonuç seçin');else if(['satis','on_talep','teklif'].includes(m.sonuc)&&!m.urunler.length)e.push(n+'ürün seçin');});
  if(z.saatElle&&!D.edit){const t=new Date(z.baslangic.zaman);if(isNaN(t)||t>new Date(Date.now()+60000))e.push('Ziyaret saati gelecekte olamaz');}
  return e;
}
async function kaydet(){
  const err=dogrula();
  if(err.length){openSheet('<h3 style="margin:0 0 8px;color:var(--bad)">Eksik bilgi</h3><ul style="margin:0 0 12px 18px;padding:0">'+err.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><button class="btn" data-act="tamam">Tamam</button>');
    const sh=sheets[sheets.length-1];attachBinder(sh.sheet,{root:{},act:()=>closeSheet(sh)});return;}
  const btn=$('#kaydetBtn');if(btn){btn.disabled=true;btn.textContent='Konum alınıyor…';}
  const z=D.z,b=D.b,now=new Date().toISOString();
  z.musteriler=z.musteriler.filter(m=>m.ad.trim()||m.sonuc||m.urunler.length||m.tel.trim());
  if(!z.sonucElle)z.sonucMetni=sonucMetniUret(z);
  b.guncelleme=now;delete b.yeni;
  if(!D.edit){
    let pos=await getPos(12000),kaynak='anlik';
    if(!pos&&z.baslangic.lat!=null){pos={lat:z.baslangic.lat,lon:z.baslangic.lon,dogruluk:z.baslangic.dogruluk};kaynak='baslangic';}
    z.olusturma=now;
    z.kayit=pos?{lat:pos.lat,lon:pos.lon,dogruluk:pos.dogruluk,zaman:now,kaynak}:null;
    const m=(pos&&b.pin)?haversine(pos.lat,pos.lon,b.pin.lat,b.pin.lon):null;
    const orijB=S.binalar.find(x=>x.id===b.id);
    const pinDegisti=!!(orijB&&orijB.pin&&b.pin&&orijB.pin.zaman!==b.pin.zaman);
    z.mesafe={m,bant:bantOf(m),pinKaynak:b.pin?b.pin.kaynak:null,pinZaman:b.pin?b.pin.zaman:null,pinDegisti};
    const dk=Math.round((new Date(now)-new Date(z.baslangic.zaman))/60000);
    if(z.saatElle){z.gecKayitDk=Math.max(0,dk);z.sureDk=null;}else{z.gecKayitDk=0;z.sureDk=Math.max(0,dk);}
  }else{
    z.surumler=z.surumler||[];z.surumler.push({surum:z.surum,zaman:z.duzenleme||z.olusturma,musteriler:D.orijinal});
    z.surum++;z.duzenleme=now;
  }
  const bi=S.binalar.findIndex(x=>x.id===b.id);if(bi>=0)S.binalar[bi]=b;else S.binalar.push(b);
  S.ayar.sonIlce=b.ilce;S.ayar.sonMahalle=b.mahalle;
  const zi=S.ziyaretler.findIndex(x=>x.id===z.id);if(zi>=0)S.ziyaretler[zi]=z;else S.ziyaretler.push(z);
  S.taslak=null;clearTimeout(tkT);
  const ok=await save();
  const edit=D.edit;const sh=formSh;D=null;if(sh)closeSheet(sh);
  render();
  if(ok)sonucSheet(z,b,edit);
}
function mesafeMesaji(z){
  if(!z.mesafe)return '';const bn=z.mesafe.bant;
  if(bn==='yok')return '<div class="warnbox">⚠ Konum alınamadığı için bina ile mesafe doğrulanamadı. Konum iznini kontrol edin.</div>';
  if(bn==='250'||bn==='500')return '<div class="okbox">✓ Konum doğrulandı: binaya yaklaşık '+z.mesafe.m+' m ('+BANT[bn]+').</div>';
  return '<div class="warnbox">⚠ Kayıt konumunuz binadan yaklaşık '+(z.mesafe.m>=1000?(z.mesafe.m/1000).toFixed(1)+' km':z.mesafe.m+' m')+' uzakta ('+BANT[bn]+'). Bu bilgi yönetici tarafında görünür.</div>';
}

function paketOlustur(){
  const cut=Date.now()-PAKET_GUN*86400000;
  const zs=S.ziyaretler.filter(z=>new Date(z.duzenleme||z.olusturma||z.baslangic.zaman).getTime()>=cut);
  const bids=new Set(zs.map(z=>z.binaId));
  const bs=S.binalar.filter(b=>bids.has(b.id));
  const now=new Date().toISOString();
  return {sema:'d2d-ziyaret-paketi',semaSurum:1,uygulama:'D2D Rapor',uygulamaSurum:APP_VERSION,olusturma:now,kapsamGun:PAKET_GUN,
    kullanici:{kod:S.ayar.kod,adSoyad:S.ayar.adSoyad},karistirma:{yontem:'kvkk-xor-b64',onek:'~K~',uyumlu:'PY/Panel kvkkEncode/kvkkDecode',alanlar:['musteriler[].ad','musteriler[].tel','musteriler[].not','ekNot','sonucMetni','yonetici.ad','yonetici.tel']},
    binalar:bs.map(b=>binaMap(b,enc)),ziyaretler:zs.map(z=>ziyaretMap(z,enc))};
}
function gununKartlari(day){return S.ziyaretler.filter(z=>!z.iptal&&dayKey(z.baslangic.zaman)===day).sort((a,b)=>new Date(a.baslangic.zaman)-new Date(b.baslangic.zaman)).map(z=>kartMetni(z,binaOf(z)));}
function pad2(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes());}
function gonderSheet(){
  if(gerekliKurulum())return;
  const paket=paketOlustur();if(!paket.ziyaretler.length){toast('Gönderilecek kayıt yok');return;}
  const today=dayKey(new Date());const kartlar=gununKartlari(today);

  const dosya='d2d-'+(slug(S.ayar.kod)||'kullanici')+'-'+pad2(new Date())+'.json';

   '<div class="info" style="margin-top:8px">Paylaş\'a basınca mail uygulamanızı seçin; alıcı olarak yönetici ve ekip liderini ekleyin. Müşteri bilgileri dosyada karıştırılmış gider.</div>'+
   (S.ayar.alicilar?'<button class="btn sec" style="margin-bottom:8px" data-act="alici">Alıcıları kopyala</button>':'')+
   '<button class="btn ok" style="margin-bottom:8px" data-act="paylas">📤 Paylaş (mail)</button><button class="btn sec" style="margin-bottom:8px" data-act="indir">Sadece dosyayı indir</button><button class="btn gray" data-act="kapat">Kapat</button>');
  const isaretle=async()=>{S.ayar.sonGonderim=new Date().toISOString();await save();render();};
  attachBinder(sh.sheet,{root:{},act:async a=>{
    if(a==='kapat')closeSheet(sh);

      }else{indir(dosya,json);await kopyala(govde);await isaretle();toast('Dosya indirildi, metin kopyalandı');}
    }
  }});
}

/* ================= SEKMELER ================= */
let TAB='bugun',binaMap_=null,binaView='liste';
function bekleyenSayi(){const t=S.ayar.sonGonderim?new Date(S.ayar.sonGonderim).getTime():0;return S.ziyaretler.filter(z=>new Date(z.duzenleme||z.olusturma||z.baslangic.zaman).getTime()>t).length;}
function viewBugun(){
  const now=new Date(),today=dayKey(now);
  const list=S.ziyaretler.filter(z=>dayKey(z.baslangic.zaman)===today).sort((a,b)=>new Date(b.baslangic.zaman)-new Date(a.baslangic.zaman));
  const act=list.filter(z=>!z.iptal);const mus=act.reduce((a,z)=>a+z.musteriler.length,0);
  const sat=Object.values(satisAdetleri(act)).reduce((a,b)=>a+b,0);
  const ay=S.ziyaretler.filter(z=>!z.iptal&&new Date(z.baslangic.zaman).getMonth()===now.getMonth()&&new Date(z.baslangic.zaman).getFullYear()===now.getFullYear());
  const aySat=satisAdetleri(ay);const bek=bekleyenSayi();
  let h='';
  if(S.taslak)h+='<div class="warnbox">Yarım kalan bir ziyaret taslağınız var. <div class="row" style="margin-top:6px"><button class="btn sm" data-act="taslakDevam">Devam et</button><button class="btn sm gray" data-act="taslakSil">Sil</button></div></div>';
  h+='<div class="tiles"><div class="tile"><b>'+act.length+'</b><span>Ziyaret</span></div><div class="tile"><b>'+mus+'</b><span>Müşteri</span></div><div class="tile"><b>'+sat+'</b><span>Satış adedi</span></div><div class="tile"><b>'+adetToplam(act,'on_talep')+'</b><span>Ön talep</span></div></div>';
  h+='<button class="btn" style="margin-bottom:8px;padding:15px" data-act="yeni">➕ Yeni Ziyaret</button>';
  h+='<div class="row" style="margin-bottom:10px"><button class="btn sec" data-act="gonder">📤 Günü Kapat / Gönder'+(bek?' ('+bek+')':'')+'</button><button class="btn sec" data-act="kartlar">📋 Günün kartları</button></div>';
  if(bek)h+='<div class="info">'+bek+' kayıt henüz gönderilmedi'+(S.ayar.sonGonderim?' (son gönderim: '+fDate2(S.ayar.sonGonderim)+')':'')+'.</div>';
  h+='<div class="card"><h3>Bu ay</h3><div class="kv"><span>Ziyaret</span><b>'+ay.length+'</b></div>'+(Object.keys(aySat).length?Object.entries(aySat).map(([k,v])=>'<div class="kv"><span>Satış — '+esc(k)+'</span><b>'+v+'</b></div>').join(''):'<div class="kv"><span>Satış</span><b>0</b></div>')+'</div>';
  h+='<div class="day">Bugünün ziyaretleri</div>'+(list.length?list.map(ziyaretKart).join(''):'<div class="empty">Bugün henüz kayıt yok</div>');
  return h;
}
function viewZiyaretler(){
  const q=trLower(window._zq||'');
  const list=S.ziyaretler.filter(z=>{if(!q)return true;const b=binaOf(z);return trLower(b.ad+' '+b.mahalle+' '+z.musteriler.map(m=>m.ad).join(' ')).includes(q);}).sort((a,b)=>new Date(b.baslangic.zaman)-new Date(a.baslangic.zaman));
  let h='<input id="zq" placeholder="Bina veya müşteri ara…" value="'+esc(window._zq||'')+'" style="margin-bottom:6px"><div class="info">Son '+SAKLAMA_GUN+' günün kayıtları telefonda tutulur; sonrası otomatik silinir.</div>';
  let last='';list.forEach(z=>{const d=dayKey(z.baslangic.zaman);if(d!==last){last=d;h+='<div class="day">'+fmtDate(z.baslangic.zaman)+'</div>';}h+=ziyaretKart(z);});
  return h+(list.length?'':'<div class="empty">Kayıt yok</div>');
}
function viewBinalar(){
  let h='<div class="seg2"><button class="chip'+(binaView==='liste'?' on':'')+'" data-act="bv" data-v="liste">Liste</button><button class="chip'+(binaView==='harita'?' on':'')+'" data-act="bv" data-v="harita">Harita</button></div>';
  if(binaView==='harita')return h+'<div id="bmap"></div><div class="row" style="margin-bottom:6px"><button class="btn sec sm" data-act="bmapTip">Uydu / Sokak</button></div><div class="info">Yeşil: bugün ziyaret edilenler. Pine dokunun.</div>';
  const q=trLower(window._bq||'');
  const list=S.binalar.filter(b=>!q||trLower(b.ad+' '+b.mahalle+' '+b.ilce+' '+(b.yonetici.ad||'')).includes(q)).sort((a,b)=>a.ad.localeCompare(b.ad,'tr'));
  h+='<input id="bq2" placeholder="Bina, mahalle, yönetici ara…" value="'+esc(window._bq||'')+'" style="margin-bottom:8px">';
  h+=list.map(b=>{const zc=S.ziyaretler.filter(z=>z.binaId===b.id&&!z.iptal).length;return '<div class="vi" data-act="binaDetay" data-id="'+b.id+'"><div class="t">'+esc(b.ad)+'</div><div class="s">'+esc([b.ilce,b.mahalle].filter(Boolean).join(' / '))+(b.yonetici.ad?' · Yönetici: '+esc(b.yonetici.ad):'')+'</div><span class="rz" style="background:var(--navy2)">'+zc+' ziyaret</span>'+(b.pin?'':'<span class="rz b-asan">Pin yok</span>')+'</div>';}).join('');
  return h+(list.length?'':'<div class="empty">Kayıtlı bina yok. İlk ziyaretinizde bina otomatik kaydedilir.</div>');
}
function initBinaMap(){
  if(binaMap_){try{binaMap_.remove();}catch(e){}binaMap_=null;}
  const el=$('#bmap');if(!el)return;if(typeof L==='undefined'){el.innerHTML='<div class="empty">Harita yüklenemedi (internet?)</div>';return;}
  const m=L.map(el).setView([37.0,35.32],12);binaMap_=m;setBase(m,tercihTip(),false);
  const today=dayKey(new Date());const pts=[];
  S.binalar.forEach(b=>{if(!b.pin)return;const g=S.ziyaretler.some(z=>z.binaId===b.id&&!z.iptal&&dayKey(z.baslangic.zaman)===today);
    const mk=L.marker([b.pin.lat,b.pin.lon],{icon:L.divIcon({className:'',html:'<div class="pin'+(g?' g':'')+'"></div>',iconSize:[26,26],iconAnchor:[13,26]})}).addTo(m);
    mk.on('click',()=>binaDetay(b.id));pts.push([b.pin.lat,b.pin.lon]);});
  if(pts.length)m.fitBounds(pts,{padding:[30,30],maxZoom:17});
  setTimeout(()=>m.invalidateSize(),80);
}
function binaDetay(id){
  const b=S.binalar.find(x=>x.id===id);if(!b)return;
  const zs=S.ziyaretler.filter(z=>z.binaId===id&&!z.iptal).sort((a,c)=>new Date(c.baslangic.zaman)-new Date(a.baslangic.zaman));
  const sh=openSheet('<h3 style="margin:0 0 6px;color:var(--navy)">'+esc(b.ad)+'</h3><div class="kv"><span>İlçe / Mahalle</span><span>'+esc([b.ilce,b.mahalle].filter(Boolean).join(' / ')||'—')+'</span></div><div class="kv"><span>Yönetici</span><span>'+esc(b.yonetici.ad||'—')+'</span></div><div class="kv"><span>Telefon</span><span>'+(b.yonetici.tel?'<a class="tel" href="tel:'+esc(b.yonetici.tel)+'">'+esc(b.yonetici.tel)+'</a>':'—')+'</span></div><div class="kv"><span>İletişim izni</span><span>'+esc(label(IZIN,b.yonetici.izin))+'</span></div><div class="kv"><span>Daire sayısı</span><span>'+esc(b.daireSayisi||'—')+'</span></div><div class="kv"><span>Altyapı</span><span>'+esc(label(ALTYAPI,b.altyapi))+'</span></div><div class="kv"><span>Bilgilendirme</span><span>'+(b.bilgilendirme?'Yapıldı':'Yapılmadı')+'</span></div><div class="kv"><span>Ziyaret ('+SAKLAMA_GUN+' gün)</span><span>'+zs.length+(zs.length?' · son '+fmtDate(zs[0].baslangic.zaman):'')+'</span></div>'+
   '<div class="row" style="margin-top:10px"><button class="btn" data-act="yeniz">Yeni ziyaret</button><button class="btn sec" data-act="duz">Düzenle</button></div>');
  attachBinder(sh.sheet,{root:{},act:a=>{if(a==='yeniz'){closeSheet(sh);formAc(false,b);}if(a==='duz'){closeSheet(sh);binaDuzenle(id);}}});
}
function binaDuzenle(id){
  const b=S.binalar.find(x=>x.id===id);if(!b)return;
  const ctx={root:{b:clone(b)}};let sh;
  const draw=()=>{sh.sheet.innerHTML='<h3 style="margin:0 0 8px;color:var(--navy)">Bina bilgilerini düzenle</h3>'+binaFields(ctx)+yoneticiFields(ctx)+'<div class="row"><button class="btn ok" data-act="kaydet">Kaydet</button><button class="btn gray" data-act="vazgec">Vazgeç</button></div>';};
  ctx.refreshPin=()=>{const r=$('#pinrow',sh.sheet);if(r)r.firstElementChild.outerHTML=pinTxt(ctx.root.b);};
  ctx.onChange=(p)=>binaOnChange(ctx,p,sh);
  ctx.act=async(a,ds)=>{
    if(a==='buradayim'||a==='haritadan')return binaAct(ctx,a,ds,sh);
    if(a==='vazgec')closeSheet(sh);
    if(a==='kaydet'){const nb=ctx.root.b;if(!nb.ad.trim()||!nb.ilce.trim()){toast('Bina adı ve ilçe gerekli');return;}nb.guncelleme=new Date().toISOString();const i=S.binalar.findIndex(x=>x.id===id);S.binalar[i]=nb;await save();closeSheet(sh);render();toast('Bina güncellendi');}
  };
  sh=openSheet('');draw();attachBinder(sh.sheet,ctx);
}
function viewAyar(){
  const n=S.ziyaretler.length,ctx={root:S};
  let h='<div class="card"><h3>Kullanıcı</h3>'+fInp({root:S},'ayar.adSoyad','Ad Soyad',{up:1})+fInp({root:S},'ayar.kod','Kullanıcı kodu (PY/Kadro ile aynı)')+'<label class="fld"><span>Mail alıcıları (yönetici, ekip lideri — kopyalamak için not)</span><textarea data-p="ayar.alicilar" placeholder="ad.soyad@... ; ad.soyad@..."></textarea></label></div>';
  h+='<div class="card"><h3>Veri ve yedek</h3><div class="kv"><span>Telefondaki ziyaret</span><b>'+n+'</b></div><div class="kv"><span>Kayıtlı bina</span><b>'+S.binalar.length+'</b></div><div class="kv"><span>Saklama süresi</span><b>'+SAKLAMA_GUN+' gün</b></div><div class="kv"><span>Kalıcı depolama</span><b id="persistDurum">…</b></div><div class="row" style="margin-top:10px"><button class="btn sec" data-act="yedekAl">Yedek Al</button><button class="btn sec" data-act="yedekYukle">Yedekten Yükle</button></div><button class="btn bad sm" style="margin-top:10px" data-act="testTemizle">Test verilerini temizle</button><input type="file" id="yedekFile" accept=".json,application/json" style="display:none"></div>';
  h+='<div class="card"><h3>İlçe / Mahalle listesi</h3><div class="kv"><span>Yüklü</span><b>'+S.ilceMahalle.length+' ilçe, '+S.ilceMahalle.reduce((a,x)=>a+x.mahalleler.length,0)+' mahalle</b></div><div class="info">CSV/metin dosyası: her satırda "İlçe;Mahalle". Excel\'den "CSV (noktalı virgülle ayrılmış)" olarak kaydedin.</div><div class="row"><button class="btn sec" data-act="listeYukle">Dosyadan yükle</button><button class="btn sec" data-act="listeSil">Listeyi temizle</button></div><input type="file" id="listeFile" accept=".csv,.txt,text/csv,text/plain" style="display:none"></div>';
  h+='<div class="card"><h3>Hakkında</h3><div class="kv"><span>Sürüm</span><b>v'+APP_VERSION+BUILD_SUFFIX+'</b></div><div class="kv"><span>Tarih</span><b>'+APP_DATE+'</b></div><button class="btn sec" style="margin-top:8px" data-act="surumNotlari">Sürüm notları</button></div>';
  return h;
}
function surumSheet(){
  const sh=openSheet('<h3 style="margin:0 0 6px;color:var(--navy)">Sürüm notları</h3><div class="chg">'+CHANGELOG.map(c=>'<h4>v'+c.v+' — '+c.t+'</h4><ul>'+c.n.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>').join('')+'</div><button class="btn gray" style="margin-top:8px" data-act="k">Kapat</button>');
  attachBinder(sh.sheet,{root:{},act:()=>closeSheet(sh)});
}

/* ================= RENDER / OLAYLAR ================= */
function render(){
  $('#kullaniciSub').textContent=S.ayar.adSoyad||'';
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));
  const app=$('#app');
  app.innerHTML=TAB==='bugun'?viewBugun():TAB==='ziyaretler'?viewZiyaretler():TAB==='binalar'?viewBinalar():viewAyar();
  if(TAB==='binalar'&&binaView==='harita')initBinaMap();
  if(TAB==='ayar'){const ta=$('textarea[data-p="ayar.alicilar"]',app);if(ta)ta.value=S.ayar.alicilar||'';
    if(navigator.storage&&navigator.storage.persisted)navigator.storage.persisted().then(p=>{const e=$('#persistDurum');if(e)e.textContent=p?'Evet':'Hayır';});else{const e=$('#persistDurum');if(e)e.textContent='Bilinmiyor';}}
}
async function yedekYukle(file){
  try{const j=JSON.parse(await file.text());if(j.sema!=='d2d-yedek')throw new Error('Geçersiz yedek dosyası');
    const r=deserialize(j.durum);const b=mergeById(S.binalar,r.binalar,x=>new Date(x.guncelleme||0).getTime());S.binalar=b.list;
    const z=mergeById(S.ziyaretler,r.ziyaretler,x=>x.surum||1);S.ziyaretler=z.list;
    if(!S.ilceMahalle.length&&r.ilceMahalle.length)S.ilceMahalle=r.ilceMahalle;
    if(!S.ayar.adSoyad&&r.ayar.adSoyad){S.ayar.adSoyad=r.ayar.adSoyad;S.ayar.kod=r.ayar.kod;}
    temizlik();await save();render();toast('Yüklendi: '+z.n+' ziyaret, '+b.n+' bina');
  }catch(e){toast('Yedek yüklenemedi: '+e.message,4000);}
}
function olaylar(){
  $('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;TAB=b.dataset.tab;render();window.scrollTo(0,0);});
  $('#verBtn').textContent='v'+APP_VERSION+BUILD_SUFFIX;$('#verBtn').addEventListener('click',surumSheet);
  const app=$('#app');
  app.addEventListener('input',e=>{const t=e.target;
    if(t.id==='zq'){window._zq=t.value;const pos=t.selectionStart;render();const n=$('#zq');n.focus();n.setSelectionRange(pos,pos);}
    else if(t.id==='bq2'){window._bq=t.value;const pos=t.selectionStart;render();const n=$('#bq2');n.focus();n.setSelectionRange(pos,pos);}
    else if(t.dataset&&t.dataset.p&&t.dataset.p.startsWith('ayar.')){pset(S,t.dataset.p,t.value);save();}
  });
  app.addEventListener('change',e=>{const t=e.target;
    if(t.id==='yedekFile'&&t.files[0])yedekYukle(t.files[0]);
    if(t.id==='listeFile'&&t.files[0])t.files[0].text().then(async tx=>{const l=ilceMahalleParse(tx);if(!l.length){toast('Liste okunamadı (İlçe;Mahalle)');return;}S.ilceMahalle=l;await save();render();toast(l.length+' ilçe yüklendi');});
  });
  app.addEventListener('click',async e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,id=a.dataset.id;
    if(act==='yeni')formAc(false);
    if(act==='taslakDevam')formAc(true);
    if(act==='taslakSil'){if(confirm('Taslak silinsin mi?')){S.taslak=null;await save();render();}}
    if(act==='gonder')gonderSheet();
    if(act==='kartlar'){const k=gununKartlari(dayKey(new Date()));if(!k.length)toast('Bugün kart yok');else kopyala(k.join('\n\n'));}
    if(act==='detay')detaySheet(id);
    if(act==='bv'){binaView=a.dataset.v;render();}
    if(act==='bmapTip'&&binaMap_){setBase(binaMap_,binaMap_._tip==='uydu'?'sokak':'uydu',true);}
    if(act==='binaDetay')binaDetay(id);
    if(act==='yedekAl'){indir('d2d-yedek-'+(slug(S.ayar.kod)||'kullanici')+'-'+pad2(new Date())+'.json',JSON.stringify({sema:'d2d-yedek',surum:1,olusturma:new Date().toISOString(),durum:serialize(S)}));toast('Yedek indirildi');}
    if(act==='yedekYukle')$('#yedekFile').click();
    if(act==='testTemizle'){if(confirm('Bu telefondaki TÜM ziyaret ve bina kayıtları silinecek (kullanıcı bilgisi ve ilçe/mahalle listesi kalır). Önce Yedek Al kullanın. Devam edilsin mi?')){S.ziyaretler=[];S.binalar=[];S.taslak=null;S.ayar.sonGonderim=null;await save();render();toast('Test verileri temizlendi');}}
    if(act==='listeYukle')$('#listeFile').click();
    if(act==='listeSil'){if(confirm('İlçe/mahalle listesi temizlensin mi?')){S.ilceMahalle=[];await save();render();}}
    if(act==='surumNotlari')surumSheet();
  });
}
async function baslat(){
  await load();
  const silinen=temizlik();if(silinen)await save();
  olaylar();render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  if(!S.ayar.adSoyad||!S.ayar.kod)kurulumSheet();
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
}
if(typeof document!=='undefined'&&!window.__D2D_TEST__)baslat();
</script>
